# Fires hourly at :30; the endpoint itself decides whether it's the
# admin-configured send hour (app_settings key 'recap_schedule') and skips
# otherwise — so the send time is adjustable from the app without redeploying.
name: Daily recap trigger
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call recap endpoint
        run: |
          curl -fsS "https://nimbaa-crm.vercel.app/api/recap?auto=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -m 120
